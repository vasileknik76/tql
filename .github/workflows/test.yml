name: test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '27 6 * * 1'

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go ${{ matrix.go }} / ${{ matrix.os }}${{ matrix.simd && ' / SIMD' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: '1.23.x'
            race: false
          - os: ubuntu-latest
            go: '1.27.x'
            race: true
          - os: macos-latest
            go: '1.27.x'
            race: true
          - os: windows-latest
            go: '1.27.x'
            race: false
          - os: ubuntu-latest
            go: '1.27.x'
            race: true
            simd: true
          - os: macos-latest
            go: '1.27.x'
            race: true
            simd: true
    env:
      GOEXPERIMENT: ${{ matrix.simd && 'simd' || '' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: go vet ./...
      - name: TOML version golden tests and reference suites (1.0, 1.1, auto)
        shell: bash
        run: |
          go test ./formats/toml -run '^TestVersionGolden$' -count=1
          go test ./conformance -run '^TestTOMLTestSuite$' -count=1
      - name: Tests and pinned parser suites with race detection
        if: matrix.race
        run: go test -race -cover ./...
      - name: Tests and pinned parser suites
        if: '!matrix.race'
        run: go test -cover ./...
      - name: Forced scalar fallback
        if: matrix.simd
        run: go test -tags purego ./...
      - name: AMD64 fallback without AVX
        if: matrix.simd && runner.os == 'Linux'
        env:
          GODEBUG: cpu.avx=off
        run: go test ./formats/json ./conformance
      - name: Fuzz SIMD scanners, parsers, and quoting
        if: matrix.simd
        shell: bash
        run: |
          go test ./internal/scan -run '^$' -fuzz '^FuzzScanners$' -fuzztime 10s -parallel 2
          make fuzz-json fuzz-toml fuzz-yaml fuzz-query fuzz-quote FUZZTIME=5s
      - name: Build CLI
        shell: bash
        run: go build -trimpath -o bin/ ./cmd/tql

  quality:
    name: Formatting, lint, and vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: false
      - run: make fmt-check
      - name: Validate GitHub Actions workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint .github/workflows/*.yml
      - uses: golangci/golangci-lint-action@0a35821d5c230e903fcfe077583637dea1b27b47 # v9.0.0
        with:
          version: v2.15.0
      - name: Check known reachable vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

  fuzz:
    name: Fuzz parsers and edits
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: false
      - name: Fuzz JSON parser
        run: make fuzz-json FUZZTIME=10s
      - name: Fuzz TOML parser
        run: make fuzz-toml FUZZTIME=10s
      - name: Fuzz YAML parser
        run: make fuzz-yaml FUZZTIME=10s
      - name: Fuzz query parser
        run: make fuzz-query FUZZTIME=10s
      - name: Fuzz script execution
        run: make fuzz-exec FUZZTIME=10s
      - name: Fuzz styled insertion
        run: make fuzz-insertion FUZZTIME=10s
      - name: Fuzz YAML edits
        run: make fuzz-yaml-edits FUZZTIME=10s
      - name: Fuzz YAML aliases
        run: make fuzz-yaml-aliases FUZZTIME=10s
      - name: Fuzz string quoting
        run: make fuzz-quote FUZZTIME=10s
      - name: Fuzz bytecode images and assembly
        run: make fuzz-bytecode FUZZTIME=10s
